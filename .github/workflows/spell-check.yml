name: Spell Check
on: [pull_request, push, workflow_dispatch]
jobs:
  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup cspell
        run: npm install -g cspell
      - name: Spell Check
        run: cspell
